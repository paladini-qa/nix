name: UI regression

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "tests/**"
      - "e2e/audit/**"
      - "index.html"
      - "package*.json"
      - "playwright.audit.config.ts"
      - "vite.config.*"
      - "vitest.config.*"
      - ".github/workflows/ui-regression.yml"

permissions:
  contents: read

jobs:
  ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test -c playwright.audit.config.ts
